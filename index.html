<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLACampusFind - Lost & Found</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        body {
           font-family: Arial, sans-serif;
           background-color: #f4f7fb;
        }

        nav {
            background-color: #14213d;
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 20px 35px;
        }
       .logo {
        color: white;
        font-size: 25px;
        font-weight: bold;
        text-decoration: none;
       }

       .nav-links {
        display: flex;
        align-items: center;
        gap: 22px;
       }
       
       .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;

       }

      .nav-links a:hover {
        color: #fca311;
       }

      .nav-links .login {
        background-color: #fca311;
        color: #14213d;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: bold;
       }

       .nav-links .login:hover {
        background-color: #ffffff;
        color: #14213d;
       }

       .hero {
        text-align: center;
        padding: 100px 20px;
       }
       
       .hero h1 {
        font-size: 42px;
        color: #14213d;
        margin-bottom: 20px;
       }

       .hero p {
        font-size: 18px;
        color: #555555;
        margin-bottom: 30px;
       }

       .hero a {
        display: inline-block;
        background-color: #fca311;
        color: #14213d;
        text-decoration: none;
        padding: 13px 22px;
        border-radius: 6px;
        font-weight: bold;
       }

       .hero a:hover {
        background-color: #14213d;
        color: white;
       }

       @media (max-width: 1000px) {
        nav {
            flex-direction: column;
            gap: 20px;
        }
        .nav-links {
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .hero h1 {
            font-size: 32px;
        }
       }
           </style>



</head>
<body>
    <nav>
    <a href="#" class="logo">GLACampusFind</a>

    <div class="nav-links">
    <a href="#">Home</a>
    <a href="lost-items.html">Lost items</a>
    <a href="found-items.html">Found items</a>
    <a href="post-items.html" onclick="return checkPostLogin()">Posted items</a>   
    
    <a href="profile.html">Profile</a>
    <a href="register.html" class="login">Login / Register</a>
    
     
     </div>
      </nav>

      <section class="hero">

        <h1>Lost Something on Campus?</h1>

        <p>
            GLACampusFind helps you reconnect with your lost belongings.
            Find lost items and help others find theirs. 
        </p>

        <a href="post-items.html"> Explore Lost & Found items</a>
      </section>
</body>
<script>
function checkPostLogin() {
    const token = localStorage.getItem("token");
    const loggedIn = localStorage.getItem("loggedIn");

    if (token && loggedIn === "true") {
        return true;
    }

    window.location.href = "login.html";
    return false;
}
</script>
</html>
