
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusFind</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #14213d;
        }

        h2 {
            color: #14213d;
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        #logoutBtn {
            background: #dc2626;
        }

        #refreshStudentsBtn {
            background: #2563eb;
            display: block;
            margin: 15px auto;
        }

        #studentSearch {
            display: block;
            width: 90%;
            max-width: 500px;
            padding: 12px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .post {
            background: white;
            padding: 15px;
            margin: 15px auto;
            max-width: 700px;
            border-radius: 8px;
        }

        .post img {
            max-width: 200px;
            max-height: 180px;
            object-fit: cover;
            display: block;
            margin: 10px 0;
        }

        .deleteBtn,
        .deleteStudentBtn {
            background: #dc2626;
        }

        .viewDetailsBtn {
            background: #2563eb;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        #backToStudentsBtn {
            background: #14213d;
            margin-bottom: 15px;
        }

        #message,
        #studentMessage {
            text-align: center;
            margin: 15px;
        }

        .table-container {
            max-width: 1100px;
            margin: 20px auto;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #14213d;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .student-count {
            text-align: center;
            font-weight: bold;
            color: #14213d;
            font-size: 18px;
        }

        /* STUDENT DETAILS */
        #studentDetailsSection {
            display: none;
            max-width: 1000px;
            margin: 25px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        #studentDetailsSection h2 {
            margin-top: 10px;
        }

        .student-info {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .student-info p {
            margin: 10px 0;
            overflow-wrap: anywhere;
        }

        .student-post {
            background: #f8fafc;
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .student-post img {
            max-width: 200px;
            max-height: 180px;
            object-fit: cover;
            display: block;
            margin: 10px 0;
        }

        #detailsMessage {
            text-align: center;
            margin: 15px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            #studentDetailsSection {
                padding: 12px;
            }

            button {
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

    <h1>CampusFind Admin Dashboard</h1>

    <button id="logoutBtn">Logout</button>

    <p id="message">Checking admin access...</p>

    <!-- MANAGE STUDENTS -->
    <h2 id="manageStudentsHeading">Manage Students</h2>

    <p id="studentCount" class="student-count">
        Total Students: 0
    </p>

    <input
        type="text"
        id="studentSearch"
        placeholder="Search by name, email or mobile number..."
    >

    <button id="refreshStudentsBtn">Refresh Students</button>

    <p id="studentMessage">Loading students...</p>

    <div class="table-container" id="studentsTableContainer">
        <table>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Student Name</th>
                    <th>Email</th>
                    <th>Mobile Number</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentsTable"></tbody>
        </table>
    </div>

    <!-- STUDENT DETAILS SECTION -->
    <section id="studentDetailsSection">

        <button id="backToStudentsBtn">
            Back to Students
        </button>

        <h2>Student Details</h2>

        <div id="studentDetails"></div>

        <h2>Student's Lost & Found Posts</h2>

        <p id="detailsMessage"></p>

        <div id="studentPosts"></div>

    </section>

    <!-- MANAGE POSTS -->
    <h2>Manage Posts</h2>

    <div id="posts"></div>

    <script>
        const API = "https://campusfind-backend-oazn.onrender.com";
        const token = localStorage.getItem("token");

        const message = document.getElementById("message");
        const postsContainer = document.getElementById("posts");

        const studentsTable = document.getElementById("studentsTable");
        const studentMessage = document.getElementById("studentMessage");
        const studentCount = document.getElementById("studentCount");
        const studentSearch = document.getElementById("studentSearch");

        const studentDetailsSection =
            document.getElementById("studentDetailsSection");

        const studentDetails =
            document.getElementById("studentDetails");

        const studentPosts =
            document.getElementById("studentPosts");

        const detailsMessage =
            document.getElementById("detailsMessage");

        let allStudents = [];

        // LOGOUT
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("role");
            localStorage.removeItem("firstName");
            localStorage.removeItem("lastName");
            localStorage.removeItem("mobile");
            localStorage.removeItem("email");

            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn")
            .addEventListener("click", logout);

        document.getElementById("refreshStudentsBtn")
            .addEventListener("click", loadStudents);

        // CHECK ADMIN
        async function checkAdmin() {
            if (!token) {
                alert("Please login first.");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(API + "/api/admin/check", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    alert("Admin access denied.");
                    window.location.href = "profile.html";
                    return;
                }

                message.textContent = "Admin access verified.";

                loadPosts();
                loadStudents();

            } catch (error) {
                message.textContent = "Backend connection failed.";
            }
        }

        // LOAD ALL REGISTERED STUDENTS
        async function loadStudents() {
            try {
                studentMessage.textContent = "Loading students...";
                studentsTable.replaceChildren();

                const response = await fetch(
                    API + "/api/admin/students",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Could not load students."
                    );
                }

                if (!Array.isArray(data)) {
                    throw new Error("Invalid students data received.");
                }

                allStudents = data;

                studentCount.textContent =
                    "Total Students: " + allStudents.length;

                displayStudents(allStudents);

            } catch (error) {
                studentMessage.textContent = error.message;
                studentCount.textContent = "Total Students: 0";
            }
        }

        // DISPLAY STUDENTS
        function displayStudents(students) {
            studentsTable.replaceChildren();

            if (students.length === 0) {
                studentMessage.textContent = "No students found.";
                return;
            }

            studentMessage.textContent =
                "Showing " + students.length + " student(s).";

            students.forEach((student, index) => {
                const row = document.createElement("tr");

                function addCell(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value || "Not available";
                    row.appendChild(cell);
                }

                addCell(index + 1);

                addCell(
                    ((student.firstName || "") + " " +
                    (student.lastName || "")).trim()
                );

                addCell(student.email);
                addCell(student.mobile);
                addCell(student.role);

                const actionCell = document.createElement("td");

                // VIEW DETAILS BUTTON
                const viewButton = document.createElement("button");

                viewButton.className = "viewDetailsBtn";
                viewButton.textContent = "View Details";

                viewButton.addEventListener("click", () => {
                    viewStudentDetails(student._id);
                });

                actionCell.appendChild(viewButton);

                // ADMIN ACCOUNT CANNOT BE DELETED
                if (
                    student.role &&
                    student.role.toLowerCase() === "admin"
                ) {
                    const protectedText = document.createElement("p");
                    protectedText.textContent = "Protected Admin";
                    actionCell.appendChild(protectedText);

                } else {
                    const deleteButton = document.createElement("button");

                    deleteButton.className = "deleteStudentBtn";
                    deleteButton.textContent = "Delete Student";

                    deleteButton.addEventListener("click", () => {
                        deleteStudent(student._id);
                    });

                    actionCell.appendChild(deleteButton);
                }

                row.appendChild(actionCell);
                studentsTable.appendChild(row);
            });
        }

        // SEARCH STUDENTS
        studentSearch.addEventListener("input", function () {
            const searchValue = studentSearch.value
                .trim()
                .toLowerCase();

            const filteredStudents = allStudents.filter(student => {
                const name =
                    ((student.firstName || "") + " " +
                    (student.lastName || "")).toLowerCase();

                const email = (student.email || "").toLowerCase();
                const mobile = (student.mobile || "").toLowerCase();

                return (
                    name.includes(searchValue) ||
                    email.includes(searchValue) ||
                    mobile.includes(searchValue)
                );
            });

            displayStudents(filteredStudents);
        });

        // VIEW INDIVIDUAL STUDENT DETAILS
        async function viewStudentDetails(id) {
            studentDetailsSection.style.display = "block";

            studentDetails.replaceChildren();
            studentPosts.replaceChildren();

            detailsMessage.textContent = "Loading student details...";

            studentDetailsSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

            try {
                const response = await fetch(
                    API + "/api/admin/students/" +
                    encodeURIComponent(id),
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Could not load student details."
                    );
                }

                const student = data.student;
                const posts = data.posts;

                if (!student) {
                    throw new Error("Student details not found.");
                }

                // DISPLAY STUDENT PROFILE
                const infoBox = document.createElement("div");
                infoBox.className = "student-info";

                function addInfo(label, value) {
                    const paragraph = document.createElement("p");
                    const strong = document.createElement("strong");

                    strong.textContent = label + ": ";

                    paragraph.appendChild(strong);
                    paragraph.appendChild(
                        document.createTextNode(value || "Not available")
                    );

                    infoBox.appendChild(paragraph);
                }

                addInfo(
                    "Name",
                    ((student.firstName || "") + " " +
                    (student.lastName || "")).trim()
                );

                addInfo("Email", student.email);
                addInfo("Mobile Number", student.mobile);
                addInfo("Role", student.role);

                studentDetails.appendChild(infoBox);

                // DISPLAY STUDENT POSTS
                studentPosts.replaceChildren();

                const studentPostList =
                    Array.isArray(posts) ? posts : [];

                detailsMessage.textContent =
                    "Total Posts: " + studentPostList.length;

                if (studentPostList.length === 0) {
                    const noPosts = document.createElement("p");
                    noPosts.textContent =
                        "No posts found for this student.";

                    studentPosts.appendChild(noPosts);
                    return;
                }

                studentPostList.forEach(post => {
                    const card = document.createElement("div");
                    card.className = "student-post";

                    function addPostText(label, value) {
                        const paragraph = document.createElement("p");
                        const strong = document.createElement("strong");

                        strong.textContent = label + ": ";

                        paragraph.appendChild(strong);
                        paragraph.appendChild(
                            document.createTextNode(value || "Not available")
                        );

                        card.appendChild(paragraph);
                    }

                    const heading = document.createElement("h3");
                    heading.textContent = post.itemName || "Unnamed Item";
                    card.appendChild(heading);

                    addPostText("Type", post.type);
                    addPostText("Category", post.category);
                    addPostText("Description", post.description);
                    addPostText("Location", post.location);
                    addPostText("Date", post.date);
                    addPostText(
                        "Status",
                        post.currentStatus || "Available"
                    );

                    if (post.returnStatus) {
                        addPostText("Return Status", post.returnStatus);
                    }

                    if (
                        post.photo &&
                        typeof post.photo === "string"
                    ) {
                        const image = document.createElement("img");
                        image.src = post.photo;
                        image.alt = "Student's posted item";
                        image.loading = "lazy";
                        card.appendChild(image);
                    }

                    studentPosts.appendChild(card);
                });

            } catch (error) {
                detailsMessage.textContent = error.message;
            }
        }

        // BACK TO STUDENTS
        document.getElementById("backToStudentsBtn")
            .addEventListener("click", function () {
                studentDetailsSection.style.display = "none";

                document.getElementById("manageStudentsHeading")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
            });

        // DELETE STUDENT AND ALL THEIR POSTS
        async function deleteStudent(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this student?\n\n" +
                "This will permanently delete:\n" +
                "1. Student account\n" +
                "2. All Lost Item posts\n" +
                "3. All Found Item posts\n\n" +
                "This action cannot be undone."
            );

            if (!confirmed) {
                return;
            }

            try {
                studentMessage.textContent = "Deleting student...";

                const response = await fetch(
                    API + "/api/admin/students/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Student deletion failed."
                    );
                }

                alert(
                    data.message +
                    "\nDeleted posts: " + (data.deletedPosts || 0)
                );

                studentSearch.value = "";
                studentDetailsSection.style.display = "none";

                await loadStudents();
                await loadPosts();

            } catch (error) {
                alert(error.message);
                studentMessage.textContent = error.message;
            }
        }

        // LOAD ALL POSTS
        async function loadPosts() {
            try {
                message.textContent = "Loading posts...";

                const response = await fetch(API + "/api/admin/posts", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not load posts.");
                }

                postsContainer.replaceChildren();

                if (!Array.isArray(data) || data.length === 0) {
                    message.textContent = "No posts found.";
                    return;
                }

                message.textContent = "Total Posts: " + data.length;

                data.forEach(post => {
                    const card = document.createElement("div");
                    card.className = "post";

                    function addText(tag, value) {
                        const element = document.createElement(tag);
                        element.textContent = value || "Not available";
                        card.appendChild(element);
                    }

                    addText("h3", post.itemName);
                    addText("p", "Type: " + (post.type || ""));
                    addText("p", "Category: " + (post.category || ""));
                    addText("p", "Description: " + (post.description || ""));
                    addText("p", "Location: " + (post.location || ""));
                    addText("p", "Date: " + (post.date || ""));

                    addText("p", "Posted by: " +
                        ((post.firstName || "") + " " +
                        (post.lastName || "")).trim());

                    addText("p", "Status: " +
                        (post.currentStatus || "Available"));

                    if (post.photo && typeof post.photo === "string") {
                        const img = document.createElement("img");
                        img.src = post.photo;
                        img.alt = "Post image";
                        card.appendChild(img);
                    }

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "deleteBtn";
                    deleteButton.textContent = "Delete Post";

                    deleteButton.addEventListener("click", () => {
                        deletePost(post._id);
                    });

                    card.appendChild(deleteButton);
                    postsContainer.appendChild(card);
                });

            } catch (error) {
                message.textContent = error.message;
            }
        }

        // DELETE POST
        async function deletePost(id) {
            if (!confirm("Are you sure you want to delete this post?")) {
                return;
            }

            try {
                const response = await fetch(
                    API + "/api/posts/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Delete failed.");
                }

                alert("Post deleted successfully!");
                loadPosts();

            } catch (error) {
                alert(error.message);
            }
        }

        checkAdmin();
    </script>

</body>
</html>
