
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusFind</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #14213d;
        }

        h2 {
            color: #14213d;
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        #logoutBtn {
            background: #dc2626;
        }

        #refreshStudentsBtn {
            background: #2563eb;
            display: block;
            margin: 15px auto;
        }

        #studentSearch {
            display: block;
            width: 90%;
            max-width: 500px;
            padding: 12px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .post {
            background: white;
            padding: 15px;
            margin: 15px auto;
            max-width: 700px;
            border-radius: 8px;
        }

        .post img {
            max-width: 200px;
            max-height: 180px;
            object-fit: cover;
            display: block;
            margin: 10px 0;
        }

        .deleteBtn,
        .deleteStudentBtn {
            background: #dc2626;
        }

        #message,
        #studentMessage {
            text-align: center;
            margin: 15px;
        }

        .table-container {
            max-width: 1100px;
            margin: 20px auto;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #14213d;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .student-count {
            text-align: center;
            font-weight: bold;
            color: #14213d;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>CampusFind Admin Dashboard</h1>

    <button id="logoutBtn">Logout</button>

    <p id="message">Checking admin access...</p>

    <!-- MANAGE STUDENTS -->
    <h2>Manage Students</h2>

    <p id="studentCount" class="student-count">
        Total Students: 0
    </p>

    <input
        type="text"
        id="studentSearch"
        placeholder="Search by name, email or mobile number..."
    >

    <button id="refreshStudentsBtn">Refresh Students</button>

    <p id="studentMessage">Loading students...</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Student Name</th>
                    <th>Email</th>
                    <th>Mobile Number</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentsTable"></tbody>
        </table>
    </div>

    <!-- MANAGE POSTS -->
    <h2>Manage Posts</h2>

    <div id="posts"></div>

    <script>
        const API = "https://campusfind-backend-oazn.onrender.com";
        const token = localStorage.getItem("token");

        const message = document.getElementById("message");
        const postsContainer = document.getElementById("posts");

        const studentsTable = document.getElementById("studentsTable");
        const studentMessage = document.getElementById("studentMessage");
        const studentCount = document.getElementById("studentCount");
        const studentSearch = document.getElementById("studentSearch");

        let allStudents = [];

        // LOGOUT
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("role");
            localStorage.removeItem("firstName");
            localStorage.removeItem("lastName");
            localStorage.removeItem("mobile");
            localStorage.removeItem("email");

            window.location.href = "login.html";
        }

        document.getElementById("logoutBtn")
            .addEventListener("click", logout);

        document.getElementById("refreshStudentsBtn")
            .addEventListener("click", loadStudents);

        // CHECK ADMIN
        async function checkAdmin() {
            if (!token) {
                alert("Please login first.");
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch(API + "/api/admin/check", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) {
                    alert("Admin access denied.");
                    window.location.href = "profile.html";
                    return;
                }

                loadPosts();
                loadStudents();

            } catch (error) {
                message.textContent = "Backend connection failed.";
            }
        }

        // LOAD ALL REGISTERED STUDENTS
        async function loadStudents() {
            try {
                studentMessage.textContent = "Loading students...";
                studentsTable.replaceChildren();

                const response = await fetch(
                    API + "/api/admin/students",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Could not load students."
                    );
                }

                if (!Array.isArray(data)) {
                    throw new Error("Invalid students data received.");
                }

                allStudents = data;

                studentCount.textContent =
                    "Total Students: " + allStudents.length;

                displayStudents(allStudents);

            } catch (error) {
                studentMessage.textContent = error.message;
                studentCount.textContent = "Total Students: 0";
            }
        }

        // DISPLAY STUDENTS
        function displayStudents(students) {
            studentsTable.replaceChildren();

            if (students.length === 0) {
                studentMessage.textContent = "No students found.";
                return;
            }

            studentMessage.textContent =
                "Showing " + students.length + " student(s).";

            students.forEach((student, index) => {
                const row = document.createElement("tr");

                function addCell(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value || "Not available";
                    row.appendChild(cell);
                }

                addCell(index + 1);

                addCell(
                    ((student.firstName || "") + " " +
                    (student.lastName || "")).trim()
                );

                addCell(student.email);
                addCell(student.mobile);
                addCell(student.role);

                const actionCell = document.createElement("td");

                // ADMIN ACCOUNT CANNOT BE DELETED
                if (
                    student.role &&
                    student.role.toLowerCase() === "admin"
                ) {
                    actionCell.textContent = "Protected Admin";
                } else {
                    const deleteButton = document.createElement("button");

                    deleteButton.className = "deleteStudentBtn";
                    deleteButton.textContent = "Delete Student";

                    deleteButton.addEventListener("click", () => {
                        deleteStudent(student._id);
                    });

                    actionCell.appendChild(deleteButton);
                }

                row.appendChild(actionCell);
                studentsTable.appendChild(row);
            });
        }

        // SEARCH STUDENTS
        studentSearch.addEventListener("input", function () {
            const searchValue = studentSearch.value
                .trim()
                .toLowerCase();

            const filteredStudents = allStudents.filter(student => {
                const name =
                    ((student.firstName || "") + " " +
                    (student.lastName || "")).toLowerCase();

                const email = (student.email || "").toLowerCase();
                const mobile = (student.mobile || "").toLowerCase();

                return (
                    name.includes(searchValue) ||
                    email.includes(searchValue) ||
                    mobile.includes(searchValue)
                );
            });

            displayStudents(filteredStudents);
        });

        // DELETE STUDENT AND ALL THEIR POSTS
        async function deleteStudent(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this student?\n\n" +
                "This will permanently delete:\n" +
                "1. Student account\n" +
                "2. All Lost Item posts\n" +
                "3. All Found Item posts\n\n" +
                "This action cannot be undone."
            );

            if (!confirmed) {
                return;
            }

            try {
                studentMessage.textContent = "Deleting student...";

                const response = await fetch(
                    API + "/api/admin/students/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Student deletion failed."
                    );
                }

                alert(
                    data.message +
                    "\nDeleted posts: " + (data.deletedPosts || 0)
                );

                studentSearch.value = "";

                await loadStudents();
                await loadPosts();

            } catch (error) {
                alert(error.message);
                studentMessage.textContent = error.message;
            }
        }

        // LOAD ALL POSTS
        async function loadPosts() {
            try {
                message.textContent = "Loading posts...";

                const response = await fetch(API + "/api/admin/posts", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not load posts.");
                }

                postsContainer.replaceChildren();

                if (!Array.isArray(data) || data.length === 0) {
                    message.textContent = "No posts found.";
                    return;
                }

                message.textContent = "Total Posts: " + data.length;

                data.forEach(post => {
                    const card = document.createElement("div");
                    card.className = "post";

                    function addText(tag, value) {
                        const element = document.createElement(tag);
                        element.textContent = value || "Not available";
                        card.appendChild(element);
                    }

                    addText("h3", post.itemName);
                    addText("p", "Type: " + (post.type || ""));
                    addText("p", "Category: " + (post.category || ""));
                    addText("p", "Description: " + (post.description || ""));
                    addText("p", "Location: " + (post.location || ""));
                    addText("p", "Date: " + (post.date || ""));

                    addText("p", "Posted by: " +
                        ((post.firstName || "") + " " +
                        (post.lastName || "")).trim());

                    addText("p", "Status: " +
                        (post.currentStatus || "Available"));

                    if (post.photo && typeof post.photo === "string") {
                        const img = document.createElement("img");
                        img.src = post.photo;
                        img.alt = "Post image";
                        card.appendChild(img);
                    }

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "deleteBtn";
                    deleteButton.textContent = "Delete Post";

                    deleteButton.addEventListener("click", () => {
                        deletePost(post._id);
                    });

                    card.appendChild(deleteButton);
                    postsContainer.appendChild(card);
                });

            } catch (error) {
                message.textContent = error.message;
            }
        }

        // DELETE POST
        async function deletePost(id) {
            if (!confirm("Are you sure you want to delete this post?")) {
                return;
            }

            try {
                const response = await fetch(
                    API + "/api/posts/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Delete failed.");
                }

                alert("Post deleted successfully!");
                loadPosts();

            } catch (error) {
                alert(error.message);
            }
        }

        checkAdmin();
    </script>

</body>
</html>
