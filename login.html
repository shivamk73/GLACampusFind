<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GLACampusFind</title>
    <style> * 
    { 
        margin: 0; padding: 0; box-sizing: border-box;
     } 
     
     body {
         font-family: Arial, sans-serif; background-color: #f4f7fb; color: #14213d;
         } 
         nav { 
            background-color: #14213d; padding: 20px 35px; 
        } 
        nav a { 
            color: white; font-size: 25px; font-weight: bold; text-decoration: none; 
        } 
        .container { 
            width: 90%; max-width: 430px; margin: 60px auto; padding: 30px; background-color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
         } 
         h1 { 
            text-align: center; margin-bottom: 10px; 
        } 
        .subtitle { 
            text-align: center; color: #666; margin-bottom: 25px; 
        }
         .form-group {
             margin-bottom: 20px; 
            } 
            label { 
                display: block; margin-bottom: 7px; font-weight: bold; 
            } 
            input {
                 width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; 
                } 
                input:focus {
                     outline: none; border-color: #fca311; 
                    } 
                    button { 
                        width: 100%; padding: 13px; background-color: #fca311; color: #14213d; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
                     } 
                     button:hover {
                         background-color: #e89400; 
                        }
                         .register-link { 
                            text-align: center; margin-top: 20px; 
                        }
                         .register-link a {
                             color: #14213d; font-weight: bold; 
                            }
                             #message {
                                 text-align: center; margin-top: 15px; 
                                }
     </style>
</head>
<body>
    <nav>
        <a href="CampusFind.html">GLACampusFind</a>
    </nav>
    <div class="container">
        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Login to your GLACampusFind account.
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email ID *</label>
                <input type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required>
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>
            </div>
            <button type="submit">Login</button>

            <p id="message" role="status"></p>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

   

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        try {
            const response = await fetch(
                "https://campusfind-backend-oazn.onrender.com/api/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Login failed.");
            }

            // Save login details
            localStorage.setItem("loggedIn", "true");
            localStorage.setItem("token", data.token);
            localStorage.setItem("firstName", data.student.firstName);
            localStorage.setItem("lastName", data.student.lastName);
            localStorage.setItem("mobile", data.student.mobile);
            localStorage.setItem("email", data.student.email);

            // Verify admin access directly with backend
            const adminCheck = await fetch(
                "https://campusfind-backend-oazn.onrender.com/api/admin/check",
                {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + data.token
                    }
                }
            );

            if (adminCheck.ok) {
                localStorage.setItem("role", "admin");
            } else if (adminCheck.status === 403) {
                localStorage.setItem("role", "student");
            } else {
                throw new Error("Role verification failed. Please try again.");
            }

            message.style.color = "green";
            message.textContent = "Login successful!";

            setTimeout(function() {
                window.location.href = "profile.html";
            }, 1000);

        } catch (error) {
            message.style.color = "red";
            message.textContent =
                error.message === "Failed to fetch"
                    ? "Backend se connection nahi ho raha."
                    : error.message;
        }
    });
</script>



</body>
</html>
